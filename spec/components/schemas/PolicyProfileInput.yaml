type: object
description: Mutable fields of a policy profile (used for create and update).
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    maxLength: 128
    description: Human-readable name for the policy profile.
  access_mode:
    type: string
    enum:
      - read_only
      - read_write
    default: read_only
    description: read_only blocks all data and schema mutations.
  statement_rules:
    $ref: ./StatementRules.yaml
  table_allowlist:
    type: array
    description: >-
      If non-empty, only these relations are reachable. A bare entry grants the
      public schema only; list another schema in full, as in billing.orders.
    items:
      type: string
      description: A relation name.
  table_denylist:
    type: array
    description: >-
      Relations explicitly blocked. A bare entry blocks that relation in every
      schema.
    items:
      type: string
      description: A relation name.
  masking_rules:
    type: array
    description: Column masking rules applied to query results.
    items:
      $ref: ./MaskingRule.yaml
  budget_queries_per_hour:
    type: integer
    minimum: 0
    default: 0
    description: Max queries per rolling hour window. 0 means unlimited.
  budget_queries_per_day:
    type: integer
    minimum: 0
    default: 0
    description: Max queries per day window. 0 means unlimited.
  max_rows:
    type: integer
    minimum: 0
    default: 0
    description: Max rows returned per query. 0 means unlimited.
  statement_timeout_ms:
    type: integer
    minimum: 0
    default: 0
    description: Upstream statement timeout for agent sessions. 0 uses the project default.
  row_filters:
    type: array
    description: Per-relation row filters ANDed into agent reads.
    items:
      $ref: ./RowFilter.yaml
  write_mode:
    type: string
    enum:
      - normal
      - rollback
      - sandbox
    default: normal
    description: >-
      How writes are handled. normal commits, rollback auto-rolls back, sandbox
      routes to an ephemeral branch.
  approval_mode:
    type: string
    enum:
      - 'off'
      - writes
      - ddl
      - all
    default: 'off'
    description: Which statement classes require human approval before execution.
  approval_auto_max_rows:
    type: integer
    minimum: 0
    default: 0
    description: >-
      Statements touching at most this many rows are auto-approved. 0 means
      none.
  approval_timeout_seconds:
    type: integer
    minimum: 0
    default: 300
    description: How long a held statement waits for a decision before expiring.
  migration_safety:
    type: string
    enum:
      - 'off'
      - warn
      - block
    default: 'off'
    description: Migration safety mode. warn surfaces findings, block refuses unsafe DDL.
  egress_bytes_per_day:
    type: integer
    format: int64
    minimum: 0
    default: 0
    description: Per-day egress budget in bytes. 0 means unlimited.
  max_affected_rows:
    type: integer
    minimum: 0
    default: 0
    description: >-
      Hard cap on rows a single write (INSERT/UPDATE/DELETE) may affect. A write
      whose affected-row count would exceed this is executed inside a
      transaction, checked, and rolled back so nothing persists, then blocked.
      Enforced independently of human approval. 0 means unlimited.
  content_scan_mode:
    type: string
    enum:
      - 'off'
      - annotate
      - block
    default: 'off'
    description: >-
      Result-content scanning, enforced on the data-plane relay path: values on
      their way out to an agent are checked for instruction-shaped content
      (stored prompt injection). off scans nothing and costs nothing. annotate
      scans and forwards every value unchanged, recording what it found. block
      is accepted and scans exactly as annotate does, but refusing the statement
      is not implemented yet, so today it also forwards every value. No mode
      drops or rewrites a row. Findings currently surface in the proxy's own
      metrics and logs, as column names, techniques and coverage counts; the
      audit event, the anomaly feed and the webhook stream are not wired to them
      yet. Values the scan cannot read (binary-format columns, columns this
      profile masks, and anything past content_scan_max_bytes) are counted as
      unscanned rather than reported clean. A proxy build older than
      result-content scanning ignores this field.
  content_scan_max_bytes:
    type: integer
    format: int64
    minimum: 0
    default: 0
    description: >-
      Byte budget for one statement's content scan, spanning all values in the
      result. Values past it are reported unscannable rather than skipped
      quietly. The budget covers a whole statement, so the statements of one
      simple-query batch share it rather than each getting a fresh allowance. 0
      uses the scanner default (4 MiB), which covers an interactive result set
      and deliberately does not cover a bulk export.
