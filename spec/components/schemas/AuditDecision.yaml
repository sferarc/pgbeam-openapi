type: string
description: >-
  Coarse outcome filter that groups audit events. `allow` = query,
  auto_approved; `block` = blocked, budget_exhausted, auth_failed,
  credential_expired, canary_tripped, rejected, approval_expired,
  result_withheld; `mask` = masked; `truncate` = truncated. Every `block` event
  except result_withheld leaves the database as it was; result_withheld is a
  statement that ran and whose result the agent was refused, so a write it made
  has committed. The progress events approval_requested, approved and
  migration_flagged group under no decision, and so does content_flagged: each
  belongs to a statement that records its own outcome as well, so grouping them
  would count that statement twice. auto_approved is not one of those: it is the
  only row an auto-approved write produces, so it groups under `allow` like any
  other completed statement.
enum:
  - allow
  - block
  - mask
  - truncate
