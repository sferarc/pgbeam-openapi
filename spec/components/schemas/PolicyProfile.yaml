type: object
description: A named bundle of rules enforced on agent credentials in the data plane.
required:
  - id
  - project_id
  - name
  - access_mode
  - table_allowlist
  - table_denylist
  - masking_rules
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique policy profile identifier (prefixed).
    example: pol_01h455vb4pex5vsknk084sn02q
  project_id:
    type: string
    description: Owning project ID.
    example: prj_01h455vb4pex5vsknk084sn02q
  name:
    type: string
    description: Human-readable name for the policy profile.
    example: Read-only analytics
  access_mode:
    type: string
    enum:
      - read_only
      - read_write
    description: read_only blocks all data and schema mutations.
  statement_rules:
    $ref: ./StatementRules.yaml
  table_allowlist:
    type: array
    description: >-
      If non-empty, only these relations are reachable. Entries are
      schema-qualified (billing.orders) or bare (orders); a bare entry grants
      the public schema only, so the same table name in another schema must be
      listed in full.
    items:
      type: string
      description: A relation name.
  table_denylist:
    type: array
    description: >-
      Relations explicitly blocked (takes precedence over the allowlist). A bare
      entry blocks that relation in every schema.
    items:
      type: string
      description: A relation name.
  masking_rules:
    type: array
    description: Column masking rules applied to query results.
    items:
      $ref: ./MaskingRule.yaml
  budget_queries_per_hour:
    type: integer
    description: Max queries per rolling hour window. 0 means unlimited.
    default: 0
  budget_queries_per_day:
    type: integer
    description: Max queries per day window. 0 means unlimited.
    default: 0
  max_rows:
    type: integer
    description: Max rows returned per query. 0 means unlimited.
    default: 0
  statement_timeout_ms:
    type: integer
    description: Upstream statement timeout for agent sessions. 0 uses the project default.
    default: 0
  row_filters:
    type: array
    description: Per-relation row filters ANDed into agent reads.
    items:
      $ref: ./RowFilter.yaml
  write_mode:
    type: string
    enum:
      - normal
      - rollback
      - sandbox
    default: normal
    description: >-
      How writes are handled. normal commits, rollback auto-rolls back, sandbox
      routes to an ephemeral branch.
  approval_mode:
    type: string
    enum:
      - 'off'
      - writes
      - ddl
      - all
    default: 'off'
    description: Which statement classes require human approval before execution.
  approval_auto_max_rows:
    type: integer
    minimum: 0
    default: 0
    description: >-
      Statements touching at most this many rows are auto-approved. 0 means
      none.
  approval_timeout_seconds:
    type: integer
    minimum: 0
    default: 300
    description: How long a held statement waits for a decision before expiring.
  migration_safety:
    type: string
    enum:
      - 'off'
      - warn
      - block
    default: 'off'
    description: Migration safety mode. warn surfaces findings, block refuses unsafe DDL.
  egress_bytes_per_day:
    type: integer
    format: int64
    minimum: 0
    default: 0
    description: Per-day egress budget in bytes. 0 means unlimited.
  max_affected_rows:
    type: integer
    minimum: 0
    default: 0
    description: >-
      Hard cap on rows a single write (INSERT/UPDATE/DELETE) may affect. A write
      whose affected-row count would exceed this is executed inside a
      transaction, checked, and rolled back so nothing persists, then blocked.
      Enforced independently of human approval. 0 means unlimited.
  content_scan_mode:
    type: string
    enum:
      - 'off'
      - annotate
      - block
    default: 'off'
    description: >-
      Result-content scanning, accepted and stored but not yet enforced: no
      released proxy build reads this field, so today every value behaves like
      off. Once enforcement ships on the data-plane relay path, values on their
      way out to an agent will be checked for instruction-shaped content (stored
      prompt injection). off will scan nothing and cost nothing. annotate will
      forward every value unchanged and record what it found. block will
      additionally refuse the statement with an error naming the column, and
      never drop a row silently. A proxy build without result-content scanning
      ignores this field.
  content_scan_max_bytes:
    type: integer
    format: int64
    minimum: 0
    default: 0
    description: >-
      Byte budget for one statement's content scan, spanning all values in the
      result. Stored but not yet read by any released proxy build, like
      content_scan_mode. Once enforced, values past it are reported unscannable
      rather than skipped quietly. 0 uses the scanner default (4 MiB), which
      covers an interactive result set and deliberately does not cover a bulk
      export.
  created_at:
    type: string
    format: date-time
    description: When the policy profile was created.
  updated_at:
    type: string
    format: date-time
    description: When the policy profile was last updated.
