type: object
description: Request body for creating or updating a contact.
required:
  - name
properties:
  company_id:
    type: string
    nullable: true
    maxLength: 255
    description: Company to attach this contact to, if any.
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: Contact full name.
  email:
    type: string
    nullable: true
    maxLength: 320
    description: Contact email address.
  title:
    type: string
    nullable: true
    maxLength: 255
    description: Job title or role.
  phone:
    type: string
    nullable: true
    maxLength: 64
    description: Phone number.
  linkedin_url:
    type: string
    nullable: true
    maxLength: 2048
    description: LinkedIn profile URL.
  notes:
    type: string
    maxLength: 10000
    description: Free-form notes about the contact.
