type: object
description: >-
  Deterministic summary of one agent session's recorded statements: what it
  touched, how much it moved, and how often the policy engine stepped in.
  Computed from the project's audit log with no model in the loop, so the same
  entries always summarize the same way. Carries schema metadata (table names)
  and counts only, never row values.
required:
  - session_id
  - project_id
  - credential_ids
  - sources
  - started_at
  - ended_at
  - duration_ms
  - entries_scanned
  - statements
  - allowed
  - blocked
  - masked
  - truncated
  - other
  - rows_returned
  - bytes_out
  - latency_ms_total
  - tables_read
  - tables_written
  - tables_blocked
  - unparsed_statements
  - scan_truncated
properties:
  session_id:
    type: string
    description: Identifier grouping the connection's statements.
    example: 0000a41f
  project_id:
    type: string
    description: Owning project ID.
  credential_ids:
    type: array
    description: >-
      Agent credentials that issued statements in this session, sorted. A
      session normally has exactly one. More than one means the session ID was
      reused, because it is unique per connection within a proxy instance and
      not over time: narrow the window with start/end to separate them.
    items:
      type: string
  sources:
    type: array
    description: Statement origins seen in the session (wire, mcp, rest, control), sorted.
    items:
      type: string
  started_at:
    type: string
    format: date-time
    description: Timestamp of the session's first scanned entry.
  ended_at:
    type: string
    format: date-time
    description: Timestamp of the session's last scanned entry.
  duration_ms:
    type: number
    description: Milliseconds between the first and last scanned entry.
  entries_scanned:
    type: integer
    format: int64
    description: >-
      Audit entries read for this session, including non-statement lifecycle
      events.
  statements:
    type: integer
    format: int64
    description: >-
      Entries carrying a statement decision, the sum of allowed, blocked, masked
      and truncated.
  allowed:
    type: integer
    format: int64
    description: Statements that ran unmodified (event `query`).
  blocked:
    type: integer
    format: int64
    description: >-
      Statements refused (events `blocked`, `budget_exhausted`, `auth_failed`,
      `credential_expired`), the same grouping the audit list's `block` decision
      filter uses.
  masked:
    type: integer
    format: int64
    description: >-
      Statements whose results had a column masked (event `masked`). One
      statement records one event, and truncation outranks masking, so a
      statement that was both masked and truncated counts under truncated only.
  truncated:
    type: integer
    format: int64
    description: Statements whose results hit a row cap (event `truncated`).
  other:
    type: integer
    format: int64
    description: >-
      Scanned entries carrying no statement decision, e.g. control-plane
      lifecycle events recorded against the session.
  rows_returned:
    type: integer
    format: int64
    description: Rows returned to the agent across the session.
  bytes_out:
    type: integer
    format: int64
    description: Bytes sent to the agent across the session.
  latency_ms_total:
    type: number
    description: Summed statement latency in milliseconds.
  tables_read:
    type: array
    description: >-
      Tables and views referenced by statements that executed as reads, sorted
      and schema-qualified when the statement qualified them.
    items:
      type: string
  tables_written:
    type: array
    description: >-
      Tables and views referenced by statements that executed as writes, sorted.
      A write that reads from another table (`UPDATE ... FROM`, a data-modifying
      CTE) lists that table here too: the audit record keeps the statement, not
      its write target, so the two cannot be told apart after the fact.
    items:
      type: string
  tables_blocked:
    type: array
    description: >-
      Tables and views referenced by statements the policy engine refused,
      sorted. These were attempted, not read, which is why they are kept out of
      tables_read and tables_written.
    items:
      type: string
  unparsed_statements:
    type: integer
    format: int64
    description: >-
      Statements whose recorded SQL could not be parsed, because the audit
      writer truncated it or because it never parsed. Their tables are missing
      from the three table lists, so a non-zero count means those lists are
      incomplete.
  scan_truncated:
    type: boolean
    description: >-
      True when the session has more entries than one summary reads. The counts
      and tables then cover the oldest entries in the window only; narrow it
      with start/end.
