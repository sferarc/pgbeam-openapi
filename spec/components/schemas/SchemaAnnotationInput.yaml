type: object
description: >
  Request body for creating or replacing a schema annotation. Keyed by
  (schema_name, table_name, column_name); an existing annotation with the same
  key is replaced.
required:
  - table_name
  - description
properties:
  schema_name:
    type: string
    nullable: true
    maxLength: 255
    description: Optional schema. Null or empty matches the unqualified form.
    example: public
  table_name:
    type: string
    minLength: 1
    maxLength: 255
    description: Relation (table or view) the annotation describes.
    example: users
  column_name:
    type: string
    nullable: true
    maxLength: 255
    description: Optional column. Null describes the table itself.
    example: email
  description:
    type: string
    minLength: 1
    maxLength: 4096
    description: The operator-written description text.
    example: Primary customer account. One row per signed-up user.
