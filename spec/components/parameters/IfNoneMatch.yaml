name: If-None-Match
in: header
required: false
description: >-
  Entity tag the client already holds, taken from the `ETag` of an earlier
  response. When it still matches the current representation the server answers
  `304 Not Modified` with no body, so a poll that finds nothing changed costs a
  round trip rather than a transfer.


  A comma-separated list is accepted, and `*` matches any current
  representation.
schema:
  type: string
  minLength: 1
  maxLength: 1024
  example: '"9f8a1c2b3d4e5f60a1b2c3d4e5f60718"'
