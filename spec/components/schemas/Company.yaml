type: object
description: A company (customer, prospect, or partner) tracked in the CRM.
required:
  - id
  - org_id
  - name
  - description
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique company identifier.
    example: cmp_01j9x8y7z6w5v4u3t2s1r0q9p8
  org_id:
    type: string
    description: Organization the company belongs to.
    example: org_abc123
  name:
    type: string
    description: Company name.
    example: Acme Corp
  domain:
    type: string
    nullable: true
    description: Primary web domain, normalized to lowercase.
    example: acme.com
  industry:
    type: string
    nullable: true
    description: Industry or sector the company operates in.
    example: Software
  location:
    type: string
    nullable: true
    description: Primary location (city, region, or country).
    example: San Francisco, CA
  logo_url:
    type: string
    nullable: true
    description: URL of the company logo.
  description:
    type: string
    description: Free-form description or research notes.
  created_at:
    type: string
    format: date-time
    description: When the company was created.
  updated_at:
    type: string
    format: date-time
    description: When the company was last updated.
