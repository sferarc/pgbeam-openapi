type: object
description: >
  One operation in a batch. `op` selects which of the per-operation fields below
  are read; any other field is ignored. The set is closed on purpose: a batch is
  not a tunnel for arbitrary requests, so every operation it can perform is
  named in this contract and carries its own permission check.
required:
  - id
  - op
properties:
  id:
    type: string
    minLength: 1
    maxLength: 64
    description: >
      Caller-assigned label, echoed on this operation's result so a caller can
      line results up with what it sent without relying on array order. Must be
      unique within the request.
    example: revoke-7
  op:
    type: string
    enum:
      - revoke_agent_credential
      - set_agent_credential_status
      - update_anomaly_alert
      - put_schema_annotation
    description: >
      Which operation to apply. `revoke_agent_credential` and
      `set_agent_credential_status` read `agent_id` (the latter also reads
      `agent_status`), `update_anomaly_alert` reads `anomaly_id` and
      `anomaly_status`, and `put_schema_annotation` reads `annotation`.
  agent_id:
    type: string
    description: >
      Agent credential to act on, for `revoke_agent_credential` and
      `set_agent_credential_status`. Must belong to the project in the path.
    example: agt_01h455vb4pex5vsknk084sn02q
  agent_status:
    type: string
    enum:
      - active
      - disabled
    description: >
      Kill-switch position to set, for `set_agent_credential_status`. Disabling
      drops the credential's live connections within seconds. A revoked
      credential is gone for good, so setting either position on one fails with
      `conflict` rather than resurrecting it.
  anomaly_id:
    type: string
    description: >
      Anomaly alert to triage, for `update_anomaly_alert`. Must belong to the
      project in the path.
    example: ano_01h455vb4pex5vsknk084sn02q
  anomaly_status:
    type: string
    enum:
      - acknowledged
      - resolved
    description: New triage state for the alert, for `update_anomaly_alert`.
  annotation:
    $ref: ./SchemaAnnotationInput.yaml
