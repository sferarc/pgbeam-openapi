type: object
description: >-
  Where the caller stands against the free daily allowance and any units it has
  paid for. Reported on every answered scan so a caller can see the 402 coming
  instead of being surprised by it.
required:
  - free_limit
  - free_remaining
  - paid_remaining
  - resets_at
properties:
  free_limit:
    type: integer
    description: Scans included per UTC day at no charge for this caller.
    example: 100
  free_remaining:
    type: integer
    description: Free scans left in the current UTC day, after this one.
    example: 97
  paid_remaining:
    type: integer
    description: >-
      Purchased scans left, after this one. Free allowance is spent first, so
      this only moves once the daily allowance is gone.
    example: 0
  resets_at:
    type: string
    format: date-time
    description: When the free allowance next resets (the next UTC midnight).
