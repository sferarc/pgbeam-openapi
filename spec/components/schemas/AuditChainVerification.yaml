type: object
description: >-
  Result of recomputing the project's tamper-evident audit hash chain over a
  time range. The chain links each entry to its predecessor, so editing or
  deleting any row breaks it.
required:
  - ok
  - verified_count
  - keyed_count
  - unchained_count
  - verified_at
properties:
  ok:
    type: boolean
    description: >-
      True when every chained entry in the range links correctly and no
      tampering or deletion was detected.
  verified_count:
    type: integer
    format: int64
    description: Number of chained entries checked.
  keyed_count:
    type: integer
    format: int64
    description: >-
      How many of the checked entries were signed with an HMAC key rather than
      hashed unkeyed. An unkeyed entry is still tamper-evident against anyone
      who cannot write to the database, but a writer can recompute it; a keyed
      one they cannot. Lower than verified_count over a range that predates the
      deployment's signing key.
  unchained_count:
    type: integer
    format: int64
    description: >-
      Pre-chain (legacy) entries in the range that predate the hash chain and
      were skipped rather than treated as tampering.
  chain_start_seq:
    type: integer
    format: int64
    nullable: true
    description: Sequence number of the first chained entry checked. Null when none.
  chain_end_seq:
    type: integer
    format: int64
    nullable: true
    description: Sequence number of the last chained entry checked. Null when none.
  first_broken_seq:
    type: integer
    format: int64
    nullable: true
    description: >-
      Sequence number where verification first failed (a tampered or deleted
      entry). Null when ok.
  failure_reason:
    type: string
    nullable: true
    description: >-
      Machine-readable failure kind: hash_mismatch (entry content edited),
      broken_link (prev_hash does not match the predecessor), missing_entry (a
      sequence number was deleted), unknown_key (the entry was signed with a key
      this deployment does not hold, so it can be neither confirmed nor called
      tampered), or key_downgrade (the chain ends in unsigned entries that
      follow a signed one with nothing signed after them, which is what
      truncating a signed chain and continuing it without the key looks like).
      Null when ok.
  verified_at:
    type: string
    format: date-time
    description: When verification ran.
