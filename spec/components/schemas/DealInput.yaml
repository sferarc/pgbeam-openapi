type: object
description: Request body for creating or updating a deal.
required:
  - title
properties:
  company_id:
    type: string
    nullable: true
    maxLength: 255
    description: Company the deal is with, if any.
  primary_contact_id:
    type: string
    nullable: true
    maxLength: 255
    description: Primary contact on the deal, if any.
  title:
    type: string
    minLength: 1
    maxLength: 255
    description: Deal title.
  stage:
    $ref: ./DealStage.yaml
  amount_cents:
    type: integer
    format: int64
    minimum: 0
    description: Deal value in the smallest currency unit (e.g. cents).
  currency:
    type: string
    minLength: 3
    maxLength: 3
    description: ISO 4217 currency code.
    example: USD
  owner:
    type: string
    maxLength: 255
    description: Deal owner (free-form, e.g. a user name or email).
  close_date:
    type: string
    format: date
    nullable: true
    description: Expected or actual close date.
