type: object
description: >-
  Per-agent usage for one project over a window, derived from the audit trail.
  Reports usage, not money: see the endpoint description for why no dollar
  figure is attributed to an agent.
required:
  - project_id
  - requested_start
  - requested_end
  - window_start
  - window_end
  - complete
  - agents
  - unattributed
  - totals
  - marginal_rates
  - drop_markers
properties:
  project_id:
    type: string
    description: Project the usage belongs to.
  requested_start:
    type: string
    format: date-time
    description: >-
      Start of the window that was actually queried. Echoed because both
      parameters are optional: omitting start defaults it to 30 days before the
      end, and a caller that did not ask for a window still needs to know which
      one it got before reading the totals as the whole picture.
  requested_end:
    type: string
    format: date-time
    description: >-
      End of the window that was actually queried, defaulting to now. The window
      is half-open, so an entry exactly at this instant is excluded. A window
      longer than 92 days is refused rather than truncated.
  window_start:
    type: string
    format: date-time
    description: >-
      First entry timestamp actually covered, not the requested start. Equal to
      window_end when the window held no entries.
  window_end:
    type: string
    format: date-time
    description: Last entry timestamp actually covered, not the requested end.
  complete:
    type: boolean
    description: >-
      False when the trail lost entries in this window, which means the totals
      below are a floor rather than a measurement. Derived from drop_markers,
      never assumed.
  agents:
    type: array
    description: >-
      One line per agent credential that appears in the window, busiest first. A
      credential with no traffic is absent rather than zero.
    items:
      $ref: ./AgentUsageLine.yaml
  unattributed:
    allOf:
      - $ref: ./AgentUsageLine.yaml
    description: >-
      Usage recorded against no credential: refused connections that never
      resolved one, control-plane sweep entries, and gap markers. Reported as
      its own line and never smeared across agents or dropped, so that the sum
      of agents plus unattributed equals totals exactly.
  totals:
    allOf:
      - $ref: ./AgentUsageLine.yaml
    description: The whole window. Equal to the sum of agents plus unattributed.
  marginal_rates:
    $ref: ./AgentUsageMarginalRates.yaml
  drop_markers:
    $ref: ./AgentUsageDropMarkers.yaml
