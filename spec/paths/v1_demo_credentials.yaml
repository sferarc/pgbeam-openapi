post:
  operationId: createDemoCredential
  summary: Issue a demo credential
  description: >-
    Issues a scoped, read-only, short-lived PostgreSQL credential plus a hosted
    MCP token against PgBeam's own demo database, with no account and no key.
    The credential is governed by the same wire-protocol policy engine every
    customer credential runs through, so a SELECT of a PII column comes back
    masked, a statement naming the table left off the allowlist is blocked, and
    a write is refused, all with machine-readable reasons. The connection string
    and MCP token are shown once. The response also carries the policy document
    that governed the demo, so a caller who then opens an account can create the
    same policy on its own database verbatim.

    Refusals are distinct on purpose. 429 means this client has asked for too
    many credentials in the last hour and should wait. 503 with a Retry-After
    header means the global ceiling on concurrent demo credentials is full, so
    backing off individually will not help; the header says when the oldest
    session expires. 503 also covers a deployment with no demo database
    configured.
  tags:
    - Demo
  security: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateDemoCredentialRequest.yaml
  responses:
    '201':
      description: A working demo credential.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DemoCredential.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '402':
      description: >-
        The requested tier is paid and no settled payment was presented. Settle
        the challenge and replay the request with payment_proof set.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DemoPaymentChallenge.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '503':
      description: >-
        No credential can be issued right now. `code` says which case it is:
        `DEMO_CAPACITY_FULL` (the global ceiling on live demo credentials is
        full, and `Retry-After` says when it frees up), `DEMO_PAUSED` (the
        operator paused the demo), `DEMO_NOT_CONFIGURED` (this deployment has no
        demo database), or `DEMO_TIER_NOT_PURCHASABLE` (a paid tier was asked
        for on a deployment with no payment method wired). They are resolved
        differently, so branch on the code rather than the status.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when waiting can help.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/Error.yaml
