type: object
description: >-
  The policy's verdict for each statement kind on its own, as the data plane
  decides it.
required:
  - policy_id
  - access_mode
  - statement_kinds
properties:
  policy_id:
    type: string
    description: The policy profile these verdicts are for.
    example: pol_xxx
  access_mode:
    type: string
    enum:
      - read_only
      - read_write
    description: >-
      The access mode enforced. Anything stored that is not read_write is
      enforced as read_only.
  statement_kinds:
    type: array
    description: One verdict per statement kind, in a fixed order.
    items:
      $ref: ./PolicyStatementKindVerdict.yaml
