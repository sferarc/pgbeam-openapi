type: object
description: Whether the policy permits one statement kind.
required:
  - kind
  - allowed
properties:
  kind:
    type: string
    description: >-
      The statement kind: select, insert, update, delete, ddl, copy, set, show,
      explain, transaction or other. other is a statement the analyzer could not
      classify (LISTEN, DEALLOCATE, cursor statements and the like). Plain
      string rather than an enum so a kind the proxy learns to classify later
      does not break an older client.
    example: select
  allowed:
    type: boolean
    description: Whether a statement of this kind is permitted.
  rule:
    type: string
    description: >-
      The machine-readable rule that refuses the kind (for example copy_blocked,
      statement_denied, statement_not_allowed, unknown_statement or read_only).
      Present only when allowed is false.
    example: read_only
  reason:
    type: string
    description: >-
      The proxy's own explanation of the refusal. Present only when allowed is
      false.
