parameters:
  - $ref: ../components/parameters/OrgId.yaml
  - $ref: ../components/parameters/SupportCaseId.yaml
get:
  operationId: getSupportCase
  summary: Get a support case
  description: Returns a support case with all its messages.
  tags:
    - Support
  parameters:
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      description: Support case with messages.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetSupportCaseResponse.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
patch:
  operationId: updateSupportCase
  summary: Update a support case
  description: Updates the status of a support case (close or reopen).
  tags:
    - Support
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateSupportCaseRequest.yaml
  responses:
    '200':
      description: Updated support case.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SupportCase.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
