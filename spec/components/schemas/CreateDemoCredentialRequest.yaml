type: object
description: >-
  Optional shaping of the demo credential. An empty body issues a free-tier
  credential, which is the intended path for an agent evaluating the product.
properties:
  tier:
    type: string
    enum:
      - free
      - extended
    default: free
    description: >-
      Which tier to issue. A paid tier is refused with 402 until payment is
      settled, and with 503 when the deployment has no payment method wired.
  label:
    type: string
    maxLength: 64
    description: >-
      A name for the caller, recorded on the session and on every audit row the
      credential produces. Free text; no identity is inferred from it.
    example: eval-agent
  payment_proof:
    type: string
    maxLength: 8192
    description: >-
      Settlement material for a paid tier, as issued by the payment challenge
      returned from a previous 402. Ignored on the free tier.
