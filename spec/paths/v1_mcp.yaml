post:
  operationId: mcpTransport
  summary: MCP server (Streamable HTTP)
  description: >-
    Model Context Protocol endpoint using the Streamable HTTP transport. Accepts
    JSON-RPC 2.0 requests and lets any MCP-compatible client (Claude Code,
    Cursor, Windsurf, custom agents) manage PgBeam resources.


    The server registers six tools, however large the API grows. Three of them
    wrap the public management API and are used in order: search, describe,
    call.

    - `search_endpoints({query})` finds operations by intent and returns their
    operation ids, methods and paths.

    - `describe_endpoint({operation_id})` returns one operation's path and query
    parameters, request body and success response.

    - `call_endpoint({operation_id, path_params, query_params, body})` invokes
    it with the caller's bearer token.

    The other three are read-only agent-skill tools: `list_skills()`,
    `get_skill({name})` and `install_skill({name})`.


    API operations are not tools themselves: pass the operation id that
    `search_endpoints` returns, such as `ListProjects`, to `call_endpoint`.
    Calling an operation id as a tool name returns an unknown-tool error.


    **Transport:** Streamable HTTP, stateless (no session id)

    **Protocol:** JSON-RPC 2.0; the MCP version is negotiated at `initialize`

    **Methods:** `initialize`, `notifications/initialized`, `tools/list`,
    `tools/call`, `ping`


    Prefer the CLI (`pgbeam mcp`) for local stdio transport. Use this endpoint
    for remote or server-to-server MCP integration.
  tags:
    - MCP
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/McpRequest.yaml
        examples:
          initialize:
            summary: Initialize session
            value:
              jsonrpc: '2.0'
              id: '1'
              method: initialize
              params:
                protocolVersion: '2025-11-25'
                capabilities: {}
                clientInfo:
                  name: my-agent
                  version: 1.0.0
          tools_list:
            summary: List available tools
            value:
              jsonrpc: '2.0'
              id: '2'
              method: tools/list
          tools_call:
            summary: Call an API operation through call_endpoint
            value:
              jsonrpc: '2.0'
              id: '3'
              method: tools/call
              params:
                name: call_endpoint
                arguments:
                  operation_id: ListProjects
                  query_params:
                    org_id: org_abc123
  responses:
    '200':
      description: JSON-RPC 2.0 response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/McpResponse.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
