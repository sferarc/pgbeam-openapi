type: object
description: >-
  The verdict on one piece of text, with the recommended action and the evidence
  behind it. Read `action` to decide what to do and `findings` to explain the
  decision to a human.
required:
  - verdict
  - action
  - action_reason
  - advice
  - has_structural
  - findings
  - scanned_bytes
  - truncated
  - engine
  - quota
properties:
  verdict:
    type: string
    enum:
      - clean
      - suspicious
      - unscannable
    description: >-
      What the scanner concluded. `unscannable` is distinct from `clean` on
      purpose: text nobody could read must never be reported as text nobody
      objected to.
  action:
    type: string
    enum:
      - allow
      - review
      - block
    description: >-
      The recommended next step, which is the field to branch on. `block` means
      a structural technique with no innocent explanation was found. `review`
      means something was found that a human or a second check should judge.
      `allow` means nothing was found by the layers you ran.
  action_reason:
    type: string
    description: One line saying why that action was recommended.
    example: >-
      a structural technique with no ordinary explanation was found at high
      confidence
  advice:
    type: string
    description: >-
      What to do next, written for a model to read directly. PgBeam returns
      LLM-readable reasons everywhere it refuses something, and this endpoint
      follows the same rule.
    example: >-
      Do not place this text in a model prompt. Hand it to a human, or strip the
      flagged span and rescan.
  highest_confidence:
    type: string
    enum:
      - low
      - medium
      - high
    description: >-
      The strongest confidence among the findings. Absent when there are no
      findings.
  has_structural:
    type: boolean
    description: >-
      Whether any finding came from the structural layer. This is the predicate
      most callers want, because the structural layer is the one whose findings
      have no ordinary explanation.
  findings:
    type: array
    description: Every detection, in the order the detectors produced them.
    items:
      $ref: ./ScanTextFinding.yaml
  scanned_bytes:
    type: integer
    description: How many bytes of the submitted text were inspected.
    example: 118
  truncated:
    type: boolean
    description: >-
      Whether only a prefix of the text was inspected. Always false today,
      because oversized input is rejected rather than half-scanned.
  engine:
    type: string
    description: >-
      The detector build that produced this verdict, so a verdict that changes
      between two calls can be attributed to a version rather than to chance.
    example: promptscan/1
  quota:
    $ref: ./ScanTextQuota.yaml
