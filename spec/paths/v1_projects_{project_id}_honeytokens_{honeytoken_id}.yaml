parameters:
  - $ref: ../components/parameters/ProjectId.yaml
  - $ref: ../components/parameters/HoneytokenId.yaml
get:
  operationId: getHoneytoken
  summary: Get a honeytoken
  description: Returns a single honeytoken by ID.
  tags:
    - Honeytokens
  parameters:
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      description: The honeytoken.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Honeytoken.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
put:
  operationId: updateHoneytoken
  summary: Update a honeytoken
  description: Updates a honeytoken's relation or action.
  tags:
    - Honeytokens
  parameters:
    - $ref: ../components/parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/HoneytokenInput.yaml
  responses:
    '200':
      description: Updated honeytoken.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Honeytoken.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '412':
      $ref: ../components/responses/PreconditionFailed.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
delete:
  operationId: deleteHoneytoken
  summary: Delete a honeytoken
  description: Removes a honeytoken from the project.
  tags:
    - Honeytokens
  responses:
    '204':
      description: Honeytoken deleted.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
