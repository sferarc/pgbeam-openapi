description: JSON-RPC 2.0 request envelope for MCP over Streamable HTTP.
type: object
required:
  - jsonrpc
  - method
properties:
  jsonrpc:
    type: string
    enum:
      - '2.0'
    description: JSON-RPC version. Must be "2.0".
    example: '2.0'
  id:
    type: string
    description: Request identifier. Omit for notifications.
    example: '1'
  method:
    type: string
    enum:
      - initialize
      - notifications/initialized
      - tools/list
      - tools/call
      - ping
    description: MCP method to invoke.
    example: initialize
  params:
    type: object
    description: >-
      Method-specific parameters. For `tools/call`, `name` is one of the six
      registered tools (`search_endpoints`, `describe_endpoint`,
      `call_endpoint`, `list_skills`, `get_skill`, `install_skill`) and
      `arguments` holds its input; API operations are reached through
      `call_endpoint`, not called by name.
