name: If-Match
in: header
required: false
description: >-
  Entity tag the write is based on, taken from the `ETag` of the read that
  produced the values being sent. The write proceeds only if it still matches
  the current representation; otherwise it is refused with `412 Precondition
  Failed` and nothing is changed.


  This is what makes a read-modify-write safe. Without it the last writer wins
  and a concurrent edit is silently discarded, which is the failure an agent is
  most likely to cause and least likely to notice. The `412` response carries
  the current `ETag`, so a caller can re-read, re-apply its change and retry.


  Omitting the header keeps the old unconditional behaviour. `*` matches any
  current representation, which asserts only that the resource exists.
schema:
  type: string
  minLength: 1
  maxLength: 1024
  example: '"9f8a1c2b3d4e5f60a1b2c3d4e5f60718"'
