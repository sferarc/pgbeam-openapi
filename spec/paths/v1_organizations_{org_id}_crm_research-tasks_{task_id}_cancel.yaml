parameters:
  - $ref: ../components/parameters/OrgId.yaml
  - $ref: ../components/parameters/CrmTaskId.yaml
post:
  operationId: cancelCrmResearchTask
  summary: Cancel a research task
  description: Cancels a pending or leased task. Terminal tasks are unaffected.
  tags:
    - Crm
  responses:
    '200':
      description: The canceled task.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResearchTask.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
