type: object
description: >-
  One usage line. The four decision counts partition every statement-shaped
  entry; entries carrying no statement decision (approval progress rows, gap
  markers) are in entries but in none of the four, which is why entries is
  reported separately rather than derived.
required:
  - entries
  - allowed
  - blocked
  - masked
  - truncated
  - rows_returned
  - bytes_out
  - cache_hit
  - cache_stale
  - cache_miss
  - cache_bypass
  - cache_none
  - latency_measured
  - latency_unmeasured
  - latency_ms_total
  - latency_p50_ms
  - latency_p95_ms
  - latency_p99_ms
properties:
  credential_id:
    type: string
    nullable: true
    description: The agent credential, or null on the unattributed and totals lines.
  entries:
    type: integer
    format: int64
    description: >-
      Audit entries of every kind, including ones carrying no decision. Not a
      statement count: a statement held for approval writes a progress row
      before its outcome, and a gap marker is not a statement at all.
  allowed:
    type: integer
    format: int64
    description: Statements that ran and returned unmodified rows.
  blocked:
    type: integer
    format: int64
    description: >-
      Statements the gateway refused, including budget, honeytoken and approval
      refusals.
  masked:
    type: integer
    format: int64
    description: Statements that ran with a column mask applied.
  truncated:
    type: integer
    format: int64
    description: Statements that ran and had their result capped.
  rows_returned:
    type: integer
    format: int64
    description: Rows returned to the client.
  bytes_out:
    type: integer
    format: int64
    description: Bytes returned to the client, the quantity the bytes meter bills on.
  cache_hit:
    type: integer
    format: int64
    description: Served from cache.
  cache_stale:
    type: integer
    format: int64
    description: Served from cache while a refresh ran behind it.
  cache_miss:
    type: integer
    format: int64
    description: Went upstream after a cache lookup found nothing.
  cache_bypass:
    type: integer
    format: int64
    description: Not eligible for cache, so no lookup was attempted.
  cache_none:
    type: integer
    format: int64
    description: >-
      No cache outcome recorded, which is what a refused statement looks like:
      it never reached the cache. Present so the five cache counts sum to
      entries and no statement is silently outside the breakdown.
  latency_measured:
    type: integer
    format: int64
    description: >-
      Entries that ran and carried a finite latency, so they fed the percentiles
      and the total. Only the three executing decisions count: allowed, masked
      and truncated.
  latency_unmeasured:
    type: integer
    format: int64
    description: >-
      Entries excluded from the percentiles and the total, counted rather than
      dropped. Two kinds. Entries that never executed carry a literal zero
      latency because there was nothing to time: every refusal, the approval
      progress rows, and the gap markers. Including those would drag an agent's
      percentiles toward zero in proportion to how often it was refused, so the
      heavily blocked agent would report the fastest queries. Entries whose
      recorded latency was NaN or an infinity are excluded too, because in
      PostgreSQL NaN sorts above every other value and so corrupts the upper
      percentiles first and the sum unconditionally.
  latency_ms_total:
    type: number
    format: double
    description: Sum of finite latencies, in milliseconds.
  latency_p50_ms:
    type: number
    format: double
    description: Median finite latency. Zero when nothing was measured.
  latency_p95_ms:
    type: number
    format: double
    description: 95th percentile finite latency. Zero when nothing was measured.
  latency_p99_ms:
    type: number
    format: double
    description: 99th percentile finite latency. Zero when nothing was measured.
  first_seen:
    type: string
    format: date-time
    nullable: true
    description: First entry for this line. Null when the line covers no entries.
  last_seen:
    type: string
    format: date-time
    nullable: true
    description: Last entry for this line. Null when the line covers no entries.
