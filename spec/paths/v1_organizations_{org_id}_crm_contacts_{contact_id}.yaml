parameters:
  - $ref: ../components/parameters/OrgId.yaml
  - $ref: ../components/parameters/CrmContactId.yaml
get:
  operationId: getCrmContact
  summary: Get a contact
  description: Get a contact.
  tags:
    - Crm
  responses:
    '200':
      description: The contact.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
put:
  operationId: updateCrmContact
  summary: Update a contact
  description: Update a contact.
  tags:
    - Crm
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ContactInput.yaml
  responses:
    '200':
      description: Updated contact.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Contact.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
delete:
  operationId: deleteCrmContact
  summary: Delete a contact
  description: Delete a contact.
  tags:
    - Crm
  responses:
    '204':
      description: Contact deleted.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
