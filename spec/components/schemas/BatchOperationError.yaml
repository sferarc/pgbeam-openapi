type: object
description: |
  Why one operation in a batch failed. Present only on a failed result.
required:
  - code
  - message
properties:
  code:
    type: string
    enum:
      - invalid_input
      - not_found
      - conflict
      - internal
    description: >
      Machine-readable reason. `not_found` covers both a resource that does not
      exist and one that exists in another project, so a batch cannot be used to
      probe for resources the caller cannot see. There is no per-operation
      authorization code: a batch the caller's role does not fully permit is
      refused whole with 403 before anything runs.
  message:
    type: string
    description: Human-readable reason, safe to surface to an operator.
    example: agent credential not found
