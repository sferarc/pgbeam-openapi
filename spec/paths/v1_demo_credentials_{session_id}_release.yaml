parameters:
  - name: session_id
    in: path
    required: true
    description: The demo session to release, as returned when it was issued.
    schema:
      type: string
post:
  operationId: releaseDemoCredential
  summary: Release a demo credential
  description: >-
    Revokes a demo credential before its TTL runs out and returns its slot to
    the global ceiling. Callers that finish early should do this so the next
    evaluating agent is not turned away by a session nobody is using. The MCP
    token issued with the credential proves the caller holds it. Releasing an
    already-expired or already-released session succeeds with released=false.
  tags:
    - Demo
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ReleaseDemoCredentialRequest.yaml
  responses:
    '200':
      description: The session was released, or was already gone.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DemoReleaseResult.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyRequests.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
