parameters:
  - $ref: ../components/parameters/ProjectId.yaml
  - $ref: ../components/parameters/AgentId.yaml
get:
  operationId: getAgentCredential
  x-feature-flag: agent-gateway
  summary: Get an agent credential
  description: Returns a single agent credential. Secrets are never included.
  tags:
    - Agents
  parameters:
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      description: The agent credential (no secrets).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentCredential.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  operationId: updateAgentCredentialStatus
  x-feature-flag: agent-gateway
  summary: Enable or disable an agent credential
  description: >-
    Toggles the kill-switch between active and disabled. Disabling drops live
    connections within seconds. Revocation is terminal and cannot be undone
    here: a revoked credential answers 409, because revoking does not change its
    secrets, so putting it back to active would make the revoked password and
    MCP token work again. Issue a new credential instead.
  tags:
    - Agents
  parameters:
    - $ref: ../components/parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateAgentCredentialStatusRequest.yaml
  responses:
    '200':
      description: Updated agent credential.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AgentCredential.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '412':
      $ref: ../components/responses/PreconditionFailed.yaml
delete:
  operationId: revokeAgentCredential
  x-feature-flag: agent-gateway
  summary: Revoke an agent credential
  description: Permanently revokes the credential and drops any live connections.
  tags:
    - Agents
  responses:
    '204':
      description: Agent credential revoked.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
