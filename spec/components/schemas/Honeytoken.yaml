type: object
description: >
  A decoy (canary) relation. Any agent statement that references it is blocked
  (fail closed) and recorded as a canary_tripped audit event.
required:
  - id
  - project_id
  - relation_name
  - action
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique honeytoken identifier.
    example: hnt_01j9x8y7z6w5v4u3t2s1r0q9p8
  project_id:
    type: string
    description: Project the honeytoken belongs to.
    example: prj_01j9x8y7z6w5v4u3t2s1r0q9p8
  schema_name:
    type: string
    nullable: true
    description: >
      Optional schema. Null matches the unqualified/public form, mirroring the
      relation allowlist normalization.
    example: public
  relation_name:
    type: string
    description: Relation (table or view) name of the decoy.
    example: customer_ssns
  action:
    type: string
    enum:
      - audit_only
      - kill
    description: >
      Response when tripped. audit_only blocks the statement, records the event,
      and fires webhooks. kill additionally disables the tripping credential via
      the kill-switch.
  created_at:
    type: string
    format: date-time
    description: When the honeytoken was registered.
  updated_at:
    type: string
    format: date-time
    description: When the honeytoken was last updated.
