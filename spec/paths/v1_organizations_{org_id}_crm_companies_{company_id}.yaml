parameters:
  - $ref: ../components/parameters/OrgId.yaml
  - $ref: ../components/parameters/CrmCompanyId.yaml
get:
  operationId: getCrmCompany
  summary: Get a company
  description: Get a company.
  tags:
    - Crm
  responses:
    '200':
      description: The company.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Company.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
put:
  operationId: updateCrmCompany
  summary: Update a company
  description: Update a company.
  tags:
    - Crm
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CompanyInput.yaml
  responses:
    '200':
      description: Updated company.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Company.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
delete:
  operationId: deleteCrmCompany
  summary: Delete a company
  description: Delete a company.
  tags:
    - Crm
  responses:
    '204':
      description: Company deleted.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
