parameters:
  - $ref: ../components/parameters/ProjectId.yaml
  - $ref: ../components/parameters/ApprovalRuleId.yaml
get:
  operationId: getApprovalRule
  summary: Get an approval rule
  description: Returns a single approval rule by ID.
  tags:
    - Approvals
  parameters:
    - $ref: ../components/parameters/IfNoneMatch.yaml
  responses:
    '200':
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
      description: The approval rule.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApprovalRule.yaml
    '304':
      $ref: ../components/responses/NotModified.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
put:
  operationId: updateApprovalRule
  summary: Update an approval rule
  description: |
    Replaces the rule's name, statement kinds, scope, row threshold and
    enabled flag. An approval request already held keeps the name it was
    held under.

    Returns 409 when the update leaves the rule enabled while the
    organization has a live self-hosted data plane enrollment, for the same
    reason as create. Setting enabled to false is still accepted.
  tags:
    - Approvals
  parameters:
    - $ref: ../components/parameters/IfMatch.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ApprovalRuleInput.yaml
  responses:
    '200':
      description: Updated approval rule.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApprovalRule.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '412':
      $ref: ../components/responses/PreconditionFailed.yaml
    '413':
      $ref: ../components/responses/PayloadTooLarge.yaml
    '415':
      $ref: ../components/responses/UnsupportedMediaType.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
delete:
  operationId: deleteApprovalRule
  summary: Delete an approval rule
  description: |
    Removes the rule, so the statements it matched are held only if the
    policy profile's approval_mode holds them. Approval requests it already
    held are not affected.
  tags:
    - Approvals
  responses:
    '204':
      description: Approval rule deleted.
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
