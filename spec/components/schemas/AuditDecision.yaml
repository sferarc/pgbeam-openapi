type: string
description: >-
  Coarse outcome filter that groups audit events. `allow` = query; `block` =
  blocked, budget_exhausted, auth_failed, credential_expired, canary_tripped,
  rejected, approval_expired; `mask` = masked; `truncate` = truncated. The
  progress events approval_requested, approved and migration_flagged group under
  no decision: each belongs to a statement that goes on to record its own
  outcome, so grouping them would count that statement twice.
enum:
  - allow
  - block
  - mask
  - truncate
