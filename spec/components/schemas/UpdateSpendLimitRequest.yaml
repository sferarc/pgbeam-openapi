type: object
description: Request body for updating an organization's monthly spend cap.
properties:
  spend_limit:
    type: number
    format: double
    nullable: true
    minimum: 0.01
    maximum: 99999999.99
    description: >-
      Monthly spend limit in dollars. Null to remove the limit. An active spend
      cap lifts only when the limit is removed or raised.
    example: 500
