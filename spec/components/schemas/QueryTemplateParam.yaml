type: object
description: >
  One declared template parameter. Its position in the params array is its
  placeholder number, so the first entry is $1.
required:
  - name
  - type
properties:
  name:
    type: string
    pattern: ^[a-z][a-z0-9_]{0,62}$
    description: >
      Parameter name, a lower-case identifier. Unique within the template. An
      agent passes the argument under this name.
    example: customer_id
  type:
    $ref: ./QueryTemplateParamType.yaml
  nullable:
    type: boolean
    default: false
    description: >
      True lets the argument be omitted or null, which binds SQL NULL. A
      parameter that is not nullable must be given a value.
    example: false
