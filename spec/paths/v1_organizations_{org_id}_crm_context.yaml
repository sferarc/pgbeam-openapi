parameters:
  - $ref: ../components/parameters/OrgId.yaml
get:
  operationId: getCrmContext
  summary: Get the org CRM context
  description: Returns the shared CRM context document for the organization.
  tags:
    - Crm
  responses:
    '200':
      description: The CRM context.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrmContext.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
put:
  operationId: updateCrmContext
  summary: Update the org CRM context
  description: Creates or updates the shared CRM context document.
  tags:
    - Crm
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CrmContextInput.yaml
  responses:
    '200':
      description: The updated CRM context.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CrmContext.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
