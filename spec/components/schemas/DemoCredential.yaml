type: object
description: >-
  A working, scoped, read-only demo credential against PgBeam's own database,
  plus everything needed to use it and to reproduce its policy on a real
  project. The connection string and MCP token are shown once and are not
  retrievable again.
required:
  - session_id
  - tier
  - connection_string
  - mcp_url
  - mcp_token
  - expires_at
  - ttl_seconds
  - query_budget
  - dataset
  - walkthrough
  - policy_template
  - upgrade
properties:
  session_id:
    type: string
    description: >-
      Identifier for this demo session. Quote it when releasing the credential,
      and it is carried on the signup link.
    example: dmo_01h455vb4pex5vsknk084sn02q
  tier:
    type: string
    description: Tier that was issued.
  connection_string:
    type: string
    description: >-
      Guarded PostgreSQL connection string. TLS is mandatory and SNI selects the
      project, so the host must not be replaced with an IP address.
  mcp_url:
    type: string
    description: Hosted MCP endpoint for the same guarded database.
  mcp_token:
    type: string
    description: Bearer token for the MCP endpoint. Shown once.
  expires_at:
    type: string
    format: date-time
    description: >-
      When the credential stops working. Past this instant the proxy refuses new
      connections and terminates live sessions.
  ttl_seconds:
    type: integer
    description: Seconds from issue to expiry.
  query_budget:
    type: integer
    description: Statements this credential may run before it is refused.
  dataset:
    $ref: ./DemoDataset.yaml
  walkthrough:
    type: array
    description: Statements to run, in order, to observe each guardrail.
    items:
      $ref: ./DemoWalkthroughStep.yaml
  policy_template:
    $ref: ./PolicyProfileInput.yaml
  upgrade:
    $ref: ./DemoUpgrade.yaml
