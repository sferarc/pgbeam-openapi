type: object
description: >
  A named, parameterized statement, scoped to a project. A policy profile set to
  admit templates only lets its credentials run the project's enabled templates
  and nothing else. A template admits a statement; it never grants access. A
  statement it admits still meets the credential's whole policy (allowlists,
  masking, row filters, budgets and approvals).
required:
  - id
  - project_id
  - name
  - description
  - sql
  - params
  - include_sql
  - enabled
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique query template identifier.
    example: qtp_01j9x8y7z6w5v4u3t2s1r0q9p8
  project_id:
    type: string
    description: Project the template belongs to.
    example: prj_01j9x8y7z6w5v4u3t2s1r0q9p8
  name:
    type: string
    description: >
      Name an agent invokes the template by. A lower-case identifier, unique
      within the project.
    example: open_orders_for_customer
  description:
    type: string
    description: What the template is for, shown to an agent that lists the templates.
    example: Open orders for one customer, newest first.
  sql:
    type: string
    description: >
      The statement, with its parameters as $1, $2 and so on. Exactly one
      SELECT, INSERT, UPDATE or DELETE. Matched on its parse tree, so
      whitespace, keyword case and comments do not matter and anything else
      does.
    example: >-
      SELECT id, total FROM orders WHERE customer_id = $1 AND status = 'open'
      ORDER BY created_at DESC
  params:
    type: array
    description: Declared parameters, in placeholder order.
    items:
      $ref: ./QueryTemplateParam.yaml
  statement_kind:
    $ref: ./QueryTemplateStatementKind.yaml
  include_sql:
    type: boolean
    description: >
      True shows the SQL text to an agent that lists the templates. False shows
      only the name, description and parameters.
    example: false
  enabled:
    type: boolean
    description: False withdraws the template, so it admits nothing.
    example: true
  created_at:
    type: string
    format: date-time
    description: When the template was created.
  updated_at:
    type: string
    format: date-time
    description: When the template was last updated.
