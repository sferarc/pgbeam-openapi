type: object
description: A revenue opportunity moving through the sales pipeline.
required:
  - id
  - org_id
  - title
  - stage
  - amount_cents
  - currency
  - owner
  - created_at
  - updated_at
properties:
  id:
    type: string
    description: Unique deal identifier.
    example: dl_01j9x8y7z6w5v4u3t2s1r0q9p8
  org_id:
    type: string
    description: Organization the deal belongs to.
    example: org_abc123
  company_id:
    type: string
    nullable: true
    description: Company the deal is with, if any.
  primary_contact_id:
    type: string
    nullable: true
    description: Primary contact on the deal, if any.
  title:
    type: string
    description: Deal title.
    example: Acme - Platform expansion
  stage:
    $ref: ./DealStage.yaml
  amount_cents:
    type: integer
    format: int64
    description: Deal value in the smallest currency unit (e.g. cents).
    example: 5000000
  currency:
    type: string
    description: ISO 4217 currency code.
    example: USD
  owner:
    type: string
    description: Deal owner (free-form, e.g. a user name or email).
  close_date:
    type: string
    format: date
    nullable: true
    description: Expected or actual close date.
  created_at:
    type: string
    format: date-time
    description: When the deal was created.
  updated_at:
    type: string
    format: date-time
    description: When the deal was last updated.
